<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyss Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=block" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
      #game { position: fixed; left: 0; top: 0; bottom: 0; right: 360px; }
      canvas { image-rendering: pixelated; }
      #chat {
        position: fixed; right: 10px; top: 50%; transform: translateY(-50%); width: 340px;
        font-family: 'Silkscreen', monospace; font-size: 12px; color: #f3ead7;
        background: rgba(16, 20, 31, 0.92); border: 3px solid #f3ead7; box-shadow: 4px 4px 0 #000;
      }
      #chat header { padding: 6px 10px; background: #25407a; color: #ffe08a; font-weight: 700; }
      #chat .log { height: 170px; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
      #chat .msg b { display: block; font-size: 10px; }
      #chat .msg.you { align-self: flex-end; text-align: right; }
      #chat .msg.you b { color: #7fb7ff; }
      #chat .msg.ship b { color: #ffe08a; }
      #chat .msg.note { color: #8a8a9a; font-size: 10px; }
      #chat form { display: flex; border-top: 2px solid #f3ead7; }
      #chat input {
        flex: 1; min-width: 0; padding: 8px; border: 0; outline: 0;
        font: inherit; color: #10141f; background: #f3ead7;
      }
      #chat button {
        padding: 0 12px; border: 0; font: inherit; font-weight: 700; cursor: pointer;
        color: #10141f; background: #ffe08a;
      }
      #chat input:disabled, #chat button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="chat">
      <header>SHIP RADIO - PARENT AGENT</header>
      <div class="log"></div>
      <form><input disabled placeholder="Tell the ship your task..." /><button disabled>SEND</button></form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
