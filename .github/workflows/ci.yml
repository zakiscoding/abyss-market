name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Validate fixtures
        run: |
          python -m abyss.contract ../fixtures/fake_run.json
          python -m abyss.contract ../fixtures/incident_payments_pool.json
          python -m abyss.contract ../fixtures/incident_ams_db_outage.json
          python -m abyss.contract ../fixtures/incident_auth_attack.json
          python -m abyss.contract ../fixtures/incident_network_partition.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
